<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portfólio · Vitória Plasido Fotografia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  --cream:#F4EDE4; --paper:#FBF7F1; --line:#E2D5C3;
  --gold:#B08A4F; --gold-soft:#C9A76F;
  --moss:#5E7262; --moss-deep:#3F5145;
  --ink:#33402F; --soft:#5D6656;
  --script:"Great Vibes","Brush Script MT",cursive;
  --serif:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-weight:300;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
body.locked{overflow:hidden}

.top{max-width:1280px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 8px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:min(56%,220px);height:auto}
.eyebrow{margin-top:18px;font-weight:500;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--script);font-weight:400;color:var(--gold);font-size:clamp(48px,11vw,64px);line-height:1;margin:6px 0 0}
.lede{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.45;color:var(--soft);margin:14px auto 0;max-width:24em}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold-soft);margin:20px 0 0;font-size:10px}
.orn::before,.orn::after{content:"";width:46px;height:1px;background:var(--gold-soft);opacity:.7}

.grid{columns:3 260px;column-gap:12px;padding:24px clamp(16px,4vw,40px) 0;max-width:1280px;margin:0 auto}
.gi{display:block;width:100%;padding:0;border:0;background:none;margin:0 0 12px;break-inside:avoid;cursor:zoom-in;border-radius:4px;overflow:hidden}
.gi img{width:100%;display:block;transition:transform .5s}
.gi:hover img{transform:scale(1.04)}
@media (max-width:560px){.grid{columns:2;column-gap:8px}.gi{margin-bottom:8px}}

.cta{text-align:center;padding:36px 16px 8px;display:grid;justify-items:center;gap:14px;color:var(--soft)}
.cta p{font-family:var(--serif);font-style:italic;font-size:20px}
.btn{display:inline-block;padding:14px 26px;border-radius:999px;background:var(--moss);color:#fff;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;transition:background .25s}
.btn:hover{background:var(--moss-deep)}
.back{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);text-decoration:none;opacity:.85;padding:10px}
.back:hover{color:var(--gold)}
.foot{text-align:center;margin:18px 0 28px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);opacity:.8}

.lb{position:fixed;inset:0;z-index:60;background:rgba(30,36,30,.94);display:grid;place-items:center;padding:56px 12px}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lb-x,.lb-nav{position:absolute;appearance:none;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:50%;cursor:pointer}
.lb-x{top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;font-size:28px;line-height:1}
.lb-nav{top:50%;transform:translateY(-50%);width:46px;height:46px;font-size:28px;line-height:1}
.lb-nav.prev{left:10px}.lb-nav.next{right:10px}
.lb-x:hover,.lb-nav:hover{background:rgba(255,255,255,.25)}
.lb-count{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-size:13px;letter-spacing:.2em}
</style>
</head>
<body>

<header class="top">
  <img class="logo" src="img/logo-crop.png" alt="Vitória Plasido Fotografia">
  <div class="eyebrow">Natal 2026</div>
  <h1>Galeria de fotos</h1>
  <p class="lede">Fotografias de sessões infantis e de família nos cenários Encanto e Tradição.</p>
  <div class="orn" aria-hidden="true">✦</div>
</header>

<main>
  <div class="grid" id="grid">
    <button type="button" class="gi"><img src="img/foto1.jpg" alt="Menino sorrindo com o livrinho, cenário Encanto" loading="lazy"></button>
    <button type="button" class="gi"><img src="img/g2.jpg" alt="Menino rindo ao lado da árvore, cenário Encanto" loading="lazy"></button>
    <button type="button" class="gi"><img src="img/rena.jpg" alt="Rena de pelúcia com almofadas vermelhas, cenário Tradição" loading="lazy"></button>
    <button type="button" class="gi"><img src="img/lanterna.jpg" alt="Menino com lanterna de Natal, cenário Encanto" loading="lazy"></button>
    <button type="button" class="gi"><img src="img/g4.jpg" alt="Menino deitado sorrindo, cenário Encanto" loading="lazy"></button>
    <button type="button" class="gi"><img src="img/g1.jpg" alt="Menino sorrindo com o livrinho nas mãos, cenário Encanto" loading="lazy"></button>
    <button type="button" class="gi"><img src="img/g3.jpg" alt="Menino deitado folheando o livrinho, cenário Encanto" loading="lazy"></button>
    <button type="button" class="gi"><img src="img/tradA.jpg" alt="Menino espiando por trás de um livro vermelho, cenário Tradição" loading="lazy"></button>
    <button type="button" class="gi"><img src="img/tradB.jpg" alt="Menino deitado sorrindo com livro aberto, cenário Tradição" loading="lazy"></button>
    <button type="button" class="gi"><img src="img/tradC.jpg" alt="Menino lendo sentado com livro aberto, cenário Tradição" loading="lazy"></button>
  </div>

  <div class="cta">
    <p>Gostou? Reserve a sua sessão de Natal.</p>
    <a class="btn" id="wa-cta" href="https://wa.me/555196505837">Quero reservar minha sessão</a>
    <a class="back" href="https://vitoriaplasidofotografia.github.io/bio/">← Voltar aos links</a>
  </div>
  <p class="foot">Campo Bom/RS · @vitoriaplasido</p>
</main>

<div class="lb" id="lightbox" hidden>
  <button type="button" class="lb-x" id="lb-close" aria-label="Fechar foto">×</button>
  <button type="button" class="lb-nav prev" id="lb-prev" aria-label="Foto anterior">‹</button>
  <img id="lb-img" alt="">
  <button type="button" class="lb-nav next" id="lb-next" aria-label="Próxima foto">›</button>
  <span class="lb-count" id="lb-count"></span>
</div>

<script>
(function(){
  var wa = document.getElementById('wa-cta');
  wa.href = 'https://wa.me/555196505837?text=' + encodeURIComponent('Olá, Vitória! Vi a galeria de fotos de Natal e quero reservar minha sessão. 🎄');

  var lb=document.getElementById('lightbox'), lbImg=document.getElementById('lb-img'), cnt=document.getElementById('lb-count');
  var items=[].slice.call(document.querySelectorAll('#grid .gi img')), i=0;
  function show(n){ i=(n+items.length)%items.length; lbImg.src=items[i].src; lbImg.alt=items[i].alt; cnt.textContent=(i+1)+' / '+items.length; }
  function close(){ lb.hidden=true; document.body.classList.remove('locked'); }
  document.querySelectorAll('#grid .gi').forEach(function(b,n){
    b.addEventListener('click',function(){ show(n); lb.hidden=false; document.body.classList.add('locked'); });
  });
  document.getElementById('lb-close').addEventListener('click',close);
  document.getElementById('lb-prev').addEventListener('click',function(e){ e.stopPropagation(); show(i-1); });
  document.getElementById('lb-next').addEventListener('click',function(e){ e.stopPropagation(); show(i+1); });
  lb.addEventListener('click',function(e){ if(e.target===lb) close(); });
  var sx=null;
  lb.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  lb.addEventListener('touchend',function(e){ if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) show(dx<0?i+1:i-1); sx=null; });
  document.addEventListener('keydown',function(e){
    if(lb.hidden) return;
    if(e.key==='Escape') close();
    if(e.key==='ArrowRight') show(i+1);
    if(e.key==='ArrowLeft') show(i-1);
  });
})();
</script>
</body>
</html>

</body></html>
